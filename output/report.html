<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutagy's Schedule Report</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚐</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    background: #f5f5f5;
    color: #1a1a1a;
    padding: 24px;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .subtitle {
    color: #666;
    margin-bottom: 32px;
    font-size: 12px;
  }

  section {
    margin-bottom: 40px;
  }

  section h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #333;
    border-bottom: 2px solid #ddd;
    padding-bottom: 6px;
  }

  /* ---- BOOKINGS TABLE ---- */
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  th {
    background: #2c3e50;
    color: #fff;
    font-weight: 600;
    padding: 8px 10px;
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    white-space: nowrap;
  }

  td {
    padding: 7px 10px;
    border-bottom: 1px solid #eee;
    vertical-align: top;
  }

  tr:last-child td { border-bottom: none; }

  tr:nth-child(even) td { background: #fafafa; }

  .action-collect { color: #c0392b; font-weight: 600; }
  .action-deliver { color: #27ae60; font-weight: 600; }

  /* ---- DRIVER / VEHICLE ACCORDION ---- */
  .accordion {
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    overflow: hidden;
  }

  .accordion-item {
    border-bottom: 1px solid #eee;
  }

  .accordion-item:last-child { border-bottom: none; }

  .accordion-header {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    cursor: pointer;
    user-select: none;
    background: #fff;
    transition: background .15s;
  }

  .accordion-header:hover { background: #f0f4f8; }

  .accordion-header.open { background: #eaf0fb; }

  .accordion-toggle {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
    color: #888;
    font-size: 11px;
    flex-shrink: 0;
    transition: transform .2s;
  }

  .accordion-header.open .accordion-toggle { transform: rotate(90deg); }

  .accordion-title {
    font-weight: 600;
    flex: 1;
  }

  .accordion-meta {
    color: #888;
    font-size: 11px;
    margin-left: 12px;
  }

  .accordion-body {
    display: none;
    padding: 0 14px 14px 42px;
  }

  .accordion-body.open { display: block; }

  .accordion-body table {
    box-shadow: none;
    border: 1px solid #e5e5e5;
    font-size: 12px;
  }

  .accordion-body th {
    background: #445566;
    font-size: 10px;
  }

  /* ---- LINKS ---- */
  a.ref {
    color: #2563eb;
    text-decoration: none;
    border-bottom: 1px dotted #93c5fd;
    cursor: pointer;
  }

  a.ref:hover { color: #1d4ed8; border-bottom-color: #1d4ed8; }

  /* highlight on jump */
  .highlight-flash {
    animation: flash .8s ease-out;
  }

  @keyframes flash {
    0%   { background: #fde68a; }
    100% { background: inherit; }
  }

  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    margin-left: 4px;
    background: #e5e7eb;
    color: #374151;
  }

  .badge-collect { background: #fee2e2; color: #991b1b; }
  .badge-deliver { background: #d1fae5; color: #065f46; }

  .no-jobs { color: #999; font-style: italic; font-size: 12px; padding: 8px 0; }

  .tba { color: #b45309; font-style: italic; }

  .unassigned-warning {
    color: #c0392b;
    font-weight: 700;
  }

  tr.row-unassigned td {
    background: #fff0f0 !important;
    border-left: 3px solid #c0392b;
  }

  /* ---- DRIVER ROUTE TIMELINE ---- */
  .route {
    padding: 8px 0 4px 0;
    font-size: 12px;
  }

  .route-node {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .route-node-spine {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
    width: 24px;
  }

  .route-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid #94a3b8;
    background: #fff;
    flex-shrink: 0;
    margin-top: 3px;
  }

  .route-dot.home    { border-color: #64748b; background: #64748b; }
  .route-dot.depot   { border-color: #7c3aed; background: #ede9fe; }
  .route-dot.collect { border-color: #c0392b; background: #fee2e2; }
  .route-dot.deliver { border-color: #27ae60; background: #d1fae5; }

  .route-node-content {
    padding-bottom: 4px;
    flex: 1;
    min-width: 0;
  }

  .route-node-label {
    font-weight: 600;
    color: #1a1a1a;
    white-space: nowrap;
  }

  .route-node-sub {
    color: #666;
    font-size: 11px;
    margin-top: 1px;
  }

  .book-ref a {
    color: #aaa;
    text-decoration: none;
    border-bottom: none;
  }
  .book-ref a:hover { color: #888; text-decoration: underline; }

  /* the vertical line + leg label between nodes */
  .route-leg {
    display: flex;
    align-items: stretch;
    gap: 10px;
    min-height: 36px;
  }

  .route-leg-spine {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
    width: 24px;
  }

  .route-leg-line {
    width: 2px;
    flex: 1;
    min-height: 28px;
    background: #cbd5e1;
  }

  .route-leg-line.driving { background: #c0392b; }
  .route-leg-line.transit { background: #3b82f6; }
  .route-leg-line.idle    { background: #d1d5db; border-left: 2px dashed #d1d5db; width: 0; }

  .route-leg-content {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 0 16px 0;
    color: #555;
    font-size: 11px;
  }

  .leg-mode {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 10px;
    white-space: nowrap;
  }

  .leg-mode.driving {
    background: #fee2e2;
    color: #991b1b;
  }

  .leg-mode.transit {
    background: #dbeafe;
    color: #1e40af;
  }

  .leg-duration {
    color: #94a3b8;
    font-style: italic;
    font-size: 10px;
  }

  .leg-vehicle-tag {
    color: #666;
    font-size: 10px;
  }

  .route-header {
    margin-top: 6px;
    margin-bottom: 10px;
  }

  .maps-route-link {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: #1a73e8;
    text-decoration: none;
    padding: 3px 8px;
    border: 1px solid #c5d9f5;
    border-radius: 4px;
    background: #f0f6ff;
  }

  .maps-route-link:hover {
    background: #dceafe;
    border-color: #93c5fd;
  }

  /* ---- DRIVER SUMMARY CHART ---- */
  .summary-chart {
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    padding: 12px 16px;
  }

  .summary-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 3px 0;
    cursor: pointer;
    border-radius: 3px;
  }
  .summary-row:hover { background: #f0f4f8; }
  .summary-row.idle { opacity: 0.45; }

  .summary-row-name {
    width: 110px;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #333;
  }
  .summary-row.idle .summary-row-name { color: #999; font-weight: 400; }

  .summary-row-track {
    flex: 1;
    height: 18px;
    background: #f1f5f9;
    border-radius: 3px;
    overflow: hidden;
    display: flex;
  }

  .summary-bar-collect {
    height: 100%;
    background: #e74c3c;
    opacity: 0.75;
  }

  .summary-bar-deliver {
    height: 100%;
    background: #27ae60;
    opacity: 0.75;
  }

  .summary-row-count {
    width: 28px;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    color: #444;
    text-align: left;
  }
  .summary-row.idle .summary-row-count { color: #bbb; }

  .postcode-link {
    font-weight: 600;
    font-size: inherit;
  }

  .kml-btn {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 4px;
    border: 1px solid #c0392b;
    background: #fff0f0;
    color: #c0392b;
    cursor: pointer;
  }
  .kml-btn:hover { background: #fee2e2; }

  /* plain hyperlink — no colour change, no underline */
  a.plain-link {
    color: inherit;
    text-decoration: none;
  }
  a.plain-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<h1>Boutagy's Schedule Report</h1>
<div class="subtitle" id="report-subtitle">Loading…</div>

<section id="section-summary">
  <h2>Driver Summary</h2>
  <div id="driver-summary"></div>
</section>

<section id="section-drivers">
  <h2>Drivers</h2>
  <div class="accordion" id="drivers-accordion"></div>
</section>

<section id="section-vehicles">
  <h2>Vehicles</h2>
  <div class="accordion" id="vehicles-accordion"></div>
</section>

<section id="section-bookings">
  <h2>Bookings</h2>
  <div id="bookings-table-wrap"></div>
</section>

<script>
// ─── DRIVER REFERENCE DATA ───────────────────────────────────────────────────
const DRIVERS_DATA = {
  'Jassim':      { home: 'W2 1NY',    branch: 'PUTNEY' },
  'Aaron Day':   { home: 'EC1Y 8QA',  branch: 'PUTNEY' },
  'Attila':      { home: 'CV21 3DH',  branch: 'PUTNEY' },
  'Chris Nobes': { home: 'TW14 9QA',  branch: 'PUTNEY' },
  'Dalibor':     { home: 'SW15 1DT',  branch: 'PUTNEY' },
  'Dave':        { home: 'SW13 9RZ',  branch: 'PUTNEY' },
  'Dean':        { home: 'KT10 8AA',  branch: 'PUTNEY' },
  'Ferdinand':   { home: 'CR2 6AA',   branch: 'PUTNEY' },
  'Gabor Deak':  { home: 'NG1 1AA',   branch: 'PUTNEY' },
  'Hesham':      { home: 'SW15 2RS',  branch: 'PUTNEY' },
  'Jim Lynch':   { home: 'SW6 2TN',   branch: 'PUTNEY' },
  'Kasia':       { home: 'SE13 5EX',  branch: 'PUTNEY' },
  'Kenneth':     { home: 'SE25 4QL',  branch: 'PUTNEY' },
  'Lourens':     { home: 'HP23 5PS',  branch: 'PUTNEY' },
  'Shaun':       { home: 'SW13 0NY',  branch: 'PUTNEY' },
  'Viktor':      { home: 'NW10 7BQ',  branch: 'PUTNEY' },
  'Dinis':       { home: 'TW14 8NX',  branch: 'FELTHAM' },
  'Mateusz':     { home: 'TW14 0LN',  branch: 'FELTHAM' },
  'Sebastian':   { home: 'TW13 7EJ',  branch: 'FELTHAM' },
  'Simon':       { home: 'TW13 5DN',  branch: 'FELTHAM' },
};

// ─── VEHICLE STORAGE LOCATIONS (from vehicle_inventory.csv) ──────────────────
// vehicle_reg -> current storage postcode
const VEHICLE_STORAGE = {
  'MK22EEA': 'TW14 9DF',  // S001 Feltham
  'BJ23XKS': 'TW14 9DF',
  'CK21YPD': 'TW14 9DF',
  'HG21EZB': 'TW14 9DF',
  'WU24DLO': 'TW14 9DF',
  'CA24AWJ': 'SW15 2SW',  // S002 Putney Head Office
  'BC23OFJ': 'SW13 9SA',  // S003 London Wetlands Centre
  'ML23LGW': 'SW13 9SA',
  'YP71VGZ': 'SW13 9SA',
  'YP21XGZ': 'SW13 9SA',
  'BC23KXF': 'SW13 9SA',
  'PO69XHZ': 'SW13 9SA',
  'YS23PUF': 'SW13 9SA',
  'MJ24NYM': 'SW13 9SA',
  'MW73GVO': 'SW13 9SA',
  'WN21UHB': 'SW13 9SA',
  'MK72FWE': 'SW13 9SA',
  'YS23PLJ': 'SW13 9SA',
};

// ─── HELPERS ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}


function anchorId(type, key) {
  // type: 'booking' | 'driver' | 'vehicle'
  return type + '-' + key.replace(/[^a-zA-Z0-9_-]/g, '_');
}

function driverLink(name) {
  if (!name) return '<span class="tba">—</span>';
  const id = anchorId('driver', name);
  return `<a class="ref" href="#${id}" onclick="jumpTo('driver','${CSS.escape(name)}')">${esc(name)}</a>`;
}

function vehicleLink(reg) {
  if (!reg) return '<span class="tba">TBA</span>';
  const id = anchorId('vehicle', reg);
  return `<a class="plain-link" href="#${id}" onclick="jumpTo('vehicle','${CSS.escape(reg)}')">🚐 ${esc(reg)}</a>`;
}

function bookingLink(bookNo, label) {
  const display = label || bookNo;
  if (!bookNo) return esc(display);
  const id = anchorId('booking', bookNo);
  return `<a class="ref" href="#${id}" onclick="jumpToBooking('${CSS.escape(bookNo)}')">${esc(display)}</a>`;
}

// ─── JUMP LOGIC ─────────────────────────────────────────────────────────────
function jumpTo(type, key) {
  const id = anchorId(type, key);
  const el = document.getElementById(id);
  if (!el) return;
  // Expand if accordion
  const header = el.querySelector('.accordion-header');
  if (header && !header.classList.contains('open')) header.click();
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.remove('highlight-flash');
  void el.offsetWidth;
  el.classList.add('highlight-flash');
}

function jumpToBooking(bookNo) {
  const id = anchorId('booking', bookNo);
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('highlight-flash');
  void el.offsetWidth;
  el.classList.add('highlight-flash');
}

// ─── MAIN ────────────────────────────────────────────────────────────────────
// Load schedule.json — the sole source of truth. Fail loudly if missing.
fetch('schedule.json')
  .then(r => {
    if (!r.ok) throw new Error('schedule.json not found (HTTP ' + r.status + ')');
    return r.json();
  })
  .then(json => main(json))
  .catch(err => {
    document.getElementById('report-subtitle').textContent = 'Error: ' + err.message;
    document.getElementById('drivers-accordion').innerHTML =
      '<div style="padding:12px;color:#c0392b">Could not load schedule.json. ' +
      'Serve this file from a local HTTP server in the same directory as schedule.json.</div>';
  });

function main(json) {
  // Build a driver-name → route map from driver_routes
  const SOLVER_ROUTES = {};
  for (const route of (json.driver_routes || [])) {
    SOLVER_ROUTES[route.driver_name] = route;
  }

  // Build a job-id → driver-name map from driver_routes legs
  const jobDriverMap = {};
  for (const route of (json.driver_routes || [])) {
    for (const leg of (route.legs || [])) {
      if (leg.job_id) jobDriverMap[leg.job_id] = route.driver_name;
    }
  }

  // Flatten jobs object to array, enriched with driver name
  const jobList = Object.values(json.jobs || {}).map(j => ({
    ...j,
    driver_name: jobDriverMap[j.job_id] || '',
  }));

  // Index by driver and vehicle for accordion sections
  const byDriver = {};   // name -> [job, ...]
  const byVehicle = {};  // reg -> [job, ...]

  for (const route of (json.driver_routes || [])) {
    byDriver[route.driver_name] = [];
  }
  jobList.forEach(j => {
    if (j.driver_name) {
      if (!byDriver[j.driver_name]) byDriver[j.driver_name] = [];
      byDriver[j.driver_name].push(j);
    }
    if (j.vehicle_reg) {
      if (!byVehicle[j.vehicle_reg]) byVehicle[j.vehicle_reg] = [];
      byVehicle[j.vehicle_reg].push(j);
    }
  });

  // Unassigned job set
  const unassignedIds = new Set(json.unassigned_job_ids || []);

  // Subtitle
  const dates = [...new Set(jobList.map(j => j.scheduled_date).filter(Boolean))].sort();
  const driverCount = Object.keys(byDriver).length;
  const status = (json.status || '').replace(/feasible/gi, '').trim().replace(/\s+/g, ' ') || null;
  const subtitleBase = jobList.length + ' jobs · ' + driverCount + ' driver' + (driverCount !== 1 ? 's' : '') +
    ' · ' + dates.join(', ') +
    ' · solved in ' + (json.solve_time_seconds != null ? Math.round(json.solve_time_seconds) : '?') + 's' + (status ? ' (' + status + ')' : '');
  const subtitleEl = document.getElementById('report-subtitle');
  subtitleEl.textContent = subtitleBase;
  if (unassignedIds.size > 0) {
    const warn = document.createElement('span');
    warn.className = 'unassigned-warning';
    warn.textContent = ' ⚠ ' + unassignedIds.size + ' unassigned job' + (unassignedIds.size !== 1 ? 's' : '') + '!';
    subtitleEl.appendChild(warn);
  }

  // ── 0. Driver summary chart ──────────────────────────────────────────────
  const allDriverNames = Object.keys(DRIVERS_DATA).sort((a, b) =>
    (byDriver[b] || []).length - (byDriver[a] || []).length);
  const maxJobs = Math.max(1, ...allDriverNames.map(n => (byDriver[n] || []).length));
  let summaryHTML = '<div class="summary-chart">';
  allDriverNames.forEach(name => {
    const jobs = byDriver[name] || [];
    const n = jobs.length;
    const idle = n === 0;
    const collectCount = jobs.filter(j => j.action === 'collect').length;
    const deliverCount = jobs.filter(j => j.action === 'deliver').length;
    const collectPct = (collectCount / maxJobs) * 100;
    const deliverPct = (deliverCount / maxJobs) * 100;
    summaryHTML += `
      <div class="summary-row${idle ? ' idle' : ''}" onclick="jumpTo('driver','${CSS.escape(name)}')">
        <div class="summary-row-name" title="${esc(name)}">${esc(name)}</div>
        <div class="summary-row-track">
          <div class="summary-bar-collect" style="width:${collectPct}%"></div>
          <div class="summary-bar-deliver" style="width:${deliverPct}%"></div>
        </div>
        <div class="summary-row-count">${idle ? '' : n}</div>
      </div>`;
  });
  summaryHTML += '</div>';
  document.getElementById('driver-summary').innerHTML = summaryHTML;

  // ── 1. Drivers accordion ─────────────────────────────────────────────────
  const driverNames = Object.keys(byDriver).sort();
  let driversHTML = '';

  driverNames.forEach(name => {
    const jobs = byDriver[name];
    const id = anchorId('driver', name);
    const collectCount = jobs.filter(j => j.action === 'collect').length;
    const deliverCount = jobs.filter(j => j.action === 'deliver').length;

    driversHTML += `<div class="accordion-item" id="${id}">`;
    driversHTML += `<div class="accordion-header" onclick="toggleAccordion(this)">
      <span class="accordion-toggle">&#9658;</span>
      <span class="accordion-title">${esc(name)}</span>
      <span class="accordion-meta">
        ${jobs.length} job${jobs.length !== 1 ? 's' : ''}
        <span class="badge badge-collect">${collectCount}C</span>
        <span class="badge badge-deliver">${deliverCount}D</span>
      </span>
    </div>`;
    driversHTML += `<div class="accordion-body">`;
    driversHTML += buildDriverRouteFromSolver(SOLVER_ROUTES[name]);
    driversHTML += `</div></div>`;
  });

  document.getElementById('drivers-accordion').innerHTML = driversHTML ||
    '<div style="padding:12px;color:#999">No driver assignments found.</div>';

  // ── 2. Vehicles accordion ─────────────────────────────────────────────────
  const vehicleRegs = Object.keys(byVehicle).sort();
  let vehiclesHTML = '';

  vehicleRegs.forEach(reg => {
    const jobs = byVehicle[reg];
    const id = anchorId('vehicle', reg);
    const group = jobs[0] ? jobs[0].vehicle_group : '';
    const collectCount = jobs.filter(j => j.action === 'collect').length;
    const deliverCount = jobs.filter(j => j.action === 'deliver').length;

    vehiclesHTML += `<div class="accordion-item" id="${id}">`;
    vehiclesHTML += `<div class="accordion-header" onclick="toggleAccordion(this)">
      <span class="accordion-toggle">&#9658;</span>
      <span class="accordion-title">${esc(reg)}</span>
      <span class="accordion-meta">
        ${group ? esc(group) + ' · ' : ''}${jobs.length} job${jobs.length !== 1 ? 's' : ''}
        <span class="badge badge-collect">${collectCount}C</span>
        <span class="badge badge-deliver">${deliverCount}D</span>
      </span>
    </div>`;
    vehiclesHTML += `<div class="accordion-body">`;
    vehiclesHTML += buildVehicleRouteFromSolver(reg, jobs);
    vehiclesHTML += `</div></div>`;
  });

  document.getElementById('vehicles-accordion').innerHTML = vehiclesHTML ||
    '<div style="padding:12px;color:#999">No vehicle assignments found.</div>';

  // ── 3. Bookings table ─────────────────────────────────────────────────────
  const bookingCols = [
    { label: 'Book No.',    key: 'book_no' },
    { label: 'Date',        key: 'scheduled_date' },
    { label: 'Time',        key: 'scheduled_time' },
    { label: 'Action',      key: 'action' },
    { label: 'Vehicle',     key: 'vehicle_reg' },
    { label: 'Group',       key: 'vehicle_group' },
    { label: 'Driver',      key: 'driver_name' },
    { label: 'Postcode',    key: 'postcode' },
  ];

  const sortedJobs = [...jobList].sort((a, b) => {
    const ka = (a.scheduled_date || '') + ' ' + (a.scheduled_time || '');
    const kb = (b.scheduled_date || '') + ' ' + (b.scheduled_time || '');
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });

  let tableHTML = '<table><thead><tr>';
  tableHTML += bookingCols.map(c => `<th>${esc(c.label)}</th>`).join('');
  tableHTML += '</tr></thead><tbody>';

  sortedJobs.forEach(j => {
    const bookNo = j.book_no;
    const id = bookNo ? ` id="${anchorId('booking', bookNo)}"` : '';
    const action = j.action || '';
    const actionClass = action === 'collect' ? 'action-collect' : action === 'deliver' ? 'action-deliver' : '';
    const isUnassigned = unassignedIds.has(j.job_id);

    tableHTML += `<tr${id}${isUnassigned ? ' class="row-unassigned"' : ''}>`;
    bookingCols.forEach(col => {
      const val = j[col.key] || '';
      let cell = '';
      if (col.key === 'book_no') {
        cell = bookNo ? `<strong>${esc(bookNo)}</strong>` : '';
      } else if (col.key === 'vehicle_reg') {
        cell = vehicleLink(val);
      } else if (col.key === 'driver_name') {
        cell = driverLink(val);
      } else if (col.key === 'action') {
        cell = val ? `<span class="${actionClass}">${esc(val)}</span>` : '';
      } else if (col.key === 'postcode') {
        cell = val ? mapsLink(val) : '';
      } else {
        cell = esc(val);
      }
      tableHTML += `<td>${cell}</td>`;
    });
    tableHTML += '</tr>';
  });

  tableHTML += '</tbody></table>';

  // ── Unassigned KML download button ────────────────────────────────────────
  const unassignedJobs = sortedJobs.filter(j => unassignedIds.has(j.job_id));
  let bookingsHeader = '';
  if (unassignedJobs.length > 0) {
    bookingsHeader = `<div style="margin-bottom:8px">
      <button class="kml-btn" onclick="downloadUnassignedKml()">&#11015; Download unassigned KML</button>
    </div>`;
  }

  document.getElementById('bookings-table-wrap').innerHTML = bookingsHeader + tableHTML;

  // stash for KML builder
  window._unassignedJobs = unassignedJobs;
}

// ─── KML EXPORT ──────────────────────────────────────────────────────────────
async function downloadUnassignedKml() {
  const jobs = window._unassignedJobs || [];
  if (!jobs.length) return;

  const postcodes = [...new Set(jobs.map(j => j.postcode).filter(Boolean))];

  // Batch geocode via postcodes.io (max 100 per request)
  let coordMap = {};
  try {
    const res = await fetch('https://api.postcodes.io/postcodes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ postcodes }),
    });
    const data = await res.json();
    for (const r of (data.result || [])) {
      if (r.result) coordMap[r.query] = { lat: r.result.latitude, lon: r.result.longitude };
    }
  } catch (e) {
    alert('Could not geocode postcodes: ' + e.message);
    return;
  }

  const placemarks = jobs.map(j => {
    const coord = coordMap[j.postcode];
    if (!coord) return '';
    const name = esc(`${j.action === 'collect' ? 'Collect' : 'Deliver'}: ${j.vehicle_reg || 'TBA'} — ${j.postcode}`);
    const desc = esc(`${j.book_no || ''} · ${j.vehicle_group || ''} · ${j.scheduled_time || ''}`);
    return `  <Placemark>
    <name>${name}</name>
    <description>${desc}</description>
    <Point><coordinates>${coord.lon},${coord.lat},0</coordinates></Point>
  </Placemark>`;
  }).filter(Boolean).join('\n');

  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
  <name>Unassigned Jobs</name>
${placemarks}
</Document>
</kml>`;

  const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'unassigned_jobs.kml';
  a.click();
  URL.revokeObjectURL(url);
}

// ─── STORAGE LOCATION LOOKUP ─────────────────────────────────────────────────
const DEPOT_NAMES = {
  'TW14 9DF': 'Feltham',
  'SW15 2SW': 'Putney Head Office',
  'SW13 9SA': 'London Wetlands Centre',
};

// ─── MAPS HELPERS ─────────────────────────────────────────────────────────────
function mapsLink(postcode, label) {
  const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(postcode + ', UK');
  const icon = label ? '🅿️' : '📍';
  return `<a class="ref postcode-link" href="${url}" target="_blank" rel="noopener">${icon} ${esc(label || postcode)}</a>`;
}

function postcodeInlineMapsLink(postcode, homePostcode) {
  const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(postcode + ', UK');
  const label = (homePostcode && postcode === homePostcode)
    ? `Home (${postcode})`
    : DEPOT_NAMES[postcode] || postcode;
  return `<a class="plain-link" href="${url}" target="_blank" rel="noopener">${esc(label)}</a>`;
}

// Build a Google Maps directions URL for a sequence of postcodes (driving mode).
// Google Maps supports origin + up to 8 waypoints + destination = 10 locations total.
const MAPS_MAX_STOPS = 10;
function buildMapsRouteUrl(postcodes) {
  const stops = postcodes.map(p => encodeURIComponent(p + ', UK'));
  const origin      = stops[0];
  const destination = stops[stops.length - 1];
  const waypoints   = stops.slice(1, -1).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=${origin}&destination=${destination}`;
  if (waypoints) url += `&waypoints=${waypoints}`;
  return url;
}

// ─── SHARED ROUTE RENDERERS ───────────────────────────────────────────────────

function renderDot(type) {
  if (type === 'home') return `<span style="font-size:14px;line-height:1">🏠</span>`;
  return `<div class="route-dot ${type}"></div>`;
}


function renderLegConnector(mode, vehicleReg, durationMinutes, fromPostcode, toPostcode, homePostcode) {
  const lineClass = mode === 'driving' ? 'driving' : 'transit';
  const modeLabel = mode === 'driving'
    ? `<span class="leg-mode driving">&#128663; driving</span>`
    : `<span class="leg-mode transit">&#128652; transit</span>`;
  const vehicleTag = vehicleReg
    ? `<span class="leg-vehicle-tag">${vehicleLink(vehicleReg)}</span>`
    : '';
  const durationTag = durationMinutes != null
    ? `<span class="leg-duration">${durationMinutes} min</span>`
    : '';
  const routeTag = (fromPostcode && toPostcode)
    ? `<span class="leg-duration">${postcodeInlineMapsLink(fromPostcode, homePostcode)} → ${postcodeInlineMapsLink(toPostcode, homePostcode)}</span>`
    : '';
  return `
    <div class="route-leg">
      <div class="route-leg-spine"><div class="route-leg-line ${lineClass}"></div></div>
      <div class="route-leg-content">
        ${modeLabel}
        ${vehicleTag}
        ${durationTag}
        ${routeTag}
      </div>
    </div>`;
}

function renderLocationNode(postcode, sublabel, dotType) {
  const label = dotType === 'home'
    ? `Home (${mapsLink(postcode)})`
    : mapsLink(postcode);
  return `
    <div class="route-node">
      <div class="route-node-spine">${renderDot(dotType)}</div>
      <div class="route-node-content">
        <div class="route-node-label">${label}</div>
        ${sublabel ? `<div class="route-node-sub">${sublabel}</div>` : ''}
      </div>
    </div>`;
}

// ─── BUILD DRIVER ROUTE TIMELINE ─────────────────────────────────────────────
function buildDriverRouteFromSolver(route) {
  const homePostcode = route.home_postcode;

  // Collect all postcodes in order for the Maps route URL
  const allPostcodes = [homePostcode];
  for (const leg of route.legs) {
    allPostcodes.push(leg.to_postcode);
  }
  // Deduplicate consecutive duplicates (e.g. home appears twice at end)
  const uniquePostcodes = allPostcodes.filter((p, i) => i === 0 || p !== allPostcodes[i - 1]);
  const truncated = uniquePostcodes.length > MAPS_MAX_STOPS;
  const mapsPostcodes = uniquePostcodes.slice(0, MAPS_MAX_STOPS);
  const mapsUrl = buildMapsRouteUrl(mapsPostcodes);
  const mapsNote = truncated ? ` <span class="leg-duration">(first ${MAPS_MAX_STOPS} stops)</span>` : '';

  let html = `<div class="route-header"><a class="maps-route-link" href="${mapsUrl}" target="_blank" rel="noopener">&#128205; Map route</a>${mapsNote}</div>`;
  html += '<div class="route">';

  html += renderLocationNode(homePostcode, '', 'home');

  for (let li = 0; li < route.legs.length; li++) {
    const leg = route.legs[li];
    const job = leg.job || null;

    // No job — classify the leg type
    if (!job) {
      if (leg.to_postcode === homePostcode) {
        // Return home leg — render connector, home node rendered after the loop
        html += renderLegConnector(leg.mode, leg.vehicle_reg, leg.duration_minutes, leg.from_postcode, leg.to_postcode, homePostcode);
        continue;
      }
      if (leg.from_postcode === leg.to_postcode) {
        // Dwell at depot (turnaround buffer) — skip, node already rendered
        continue;
      }
      // Depot leg — drop-off or pick-up
      const depotName = leg.depot_name || leg.to_postcode;
      const dropReg = leg.vehicle_reg || null;
      // For pick-up legs the vehicle_reg may sit on the next leg;
      // for drop-off legs, look ahead past any dwell to find a departing vehicle
      let pickupReg = null;
      if (!dropReg) {
        pickupReg = (route.legs[li + 1] || {}).vehicle_reg || null;
      } else {
        // scan ahead past dwell legs at the same postcode
        for (let ahead = li + 1; ahead < route.legs.length; ahead++) {
          const al = route.legs[ahead];
          if (al.from_postcode === leg.to_postcode && al.vehicle_reg) {
            pickupReg = al.vehicle_reg;
            break;
          }
          if (al.from_postcode !== leg.to_postcode) break;
        }
      }
      const sublabel = dropReg && pickupReg
        ? `Drop off ${vehicleLink(dropReg)} · Pick up ${vehicleLink(pickupReg)}`
        : dropReg
        ? `Drop off ${vehicleLink(dropReg)}`
        : pickupReg
        ? `Pick up ${vehicleLink(pickupReg)}`
        : 'Pick up van';
      html += renderLegConnector(leg.mode, leg.vehicle_reg, leg.duration_minutes, leg.from_postcode, leg.to_postcode, homePostcode);
      html += `
        <div class="route-node">
          <div class="route-node-spine">${renderDot('depot')}</div>
          <div class="route-node-content">
            <div class="route-node-label">${mapsLink(leg.to_postcode, depotName)} · ${sublabel}</div>
          </div>
        </div>`;
      continue;
    }

    html += renderLegConnector(leg.mode, leg.vehicle_reg, leg.duration_minutes, leg.from_postcode, leg.to_postcode, homePostcode);

    // Job stop node
    if (job) {
      const action = job.action || '';
      const dotType = action === 'collect' ? 'collect' : action === 'deliver' ? 'deliver' : 'home';
      const actionLabel = action === 'collect'
        ? `<span class="action-collect">Collect:</span>`
        : action === 'deliver'
        ? `<span class="action-deliver">Deliver:</span>`
        : '';
      const timeLabel = job.start_time
        ? `<strong>${esc(job.start_time.slice(11))}</strong>` // HH:MM from datetime
        : job.scheduled_time
        ? `<strong>${esc(job.scheduled_time)}</strong>`
        : '';
      const vehicleReg = leg.vehicle_reg || job.vehicle_reg;
      const bookRef = job.book_no
        ? `<span class="book-ref">${bookingLink(job.book_no)}</span>`
        : '';

      html += `
        <div class="route-node">
          <div class="route-node-spine">${renderDot(dotType)}</div>
          <div class="route-node-content">
            <div class="route-node-label">${actionLabel} ${vehicleReg ? vehicleLink(vehicleReg) : ''}${job.vehicle_group ? ' <span style="color:#888;font-size:10px">(' + esc(job.vehicle_group) + ')</span>' : ''} ${action === 'collect' ? 'from' : 'to'} ${mapsLink(leg.to_postcode)} @ ${timeLabel} ${bookRef}</div>
          </div>
        </div>`;
    } else {
      // Return-home leg has no job — this is the home node, rendered after the loop
    }
  }

  html += renderLocationNode(homePostcode, '', 'home');
  html += '</div>';
  return html;
}

// ─── BUILD VEHICLE ROUTE TIMELINE ────────────────────────────────────────────
// jobs: array of job objects from json.jobs, each enriched with driver_name
function buildVehicleRouteFromSolver(reg, jobs) {
  const sorted = [...jobs].sort((a, b) => {
    const ka = (a.scheduled_date || '') + ' ' + (a.scheduled_time || '');
    const kb = (b.scheduled_date || '') + ' ' + (b.scheduled_time || '');
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });

  const stops = sorted.map(j => ({
    type: j.action || '',
    postcode: j.postcode || '',
    time: j.scheduled_time || '',
    driver: j.driver_name || '',
    bookNo: j.book_no || '',
    group: j.vehicle_group || '',
  }));

  // Track custody: Collect → driver has van; Deliver → van handed back
  const legModes = [];
  let currentDriver = null;
  for (let i = 0; i < stops.length; i++) {
    legModes.push(i === 0 ? { mode: 'idle', driver: null }
                           : { mode: currentDriver ? 'driving' : 'idle', driver: currentDriver });
    if (stops[i].type === 'collect') currentDriver = stops[i].driver || null;
    else if (stops[i].type === 'deliver') currentDriver = null;
  }
  const finalLeg = { mode: 'idle', driver: null };

  const storagePostcode = VEHICLE_STORAGE[reg] || null;
  const allPostcodes = [
    ...(storagePostcode ? [storagePostcode] : []),
    ...stops.map(s => s.postcode),
  ];
  const uniquePostcodes = allPostcodes.filter((p, i) => i === 0 || p !== allPostcodes[i - 1]);
  const truncated = uniquePostcodes.length > MAPS_MAX_STOPS;
  const mapsPostcodes = uniquePostcodes.slice(0, MAPS_MAX_STOPS);
  const mapsUrl = buildMapsRouteUrl(mapsPostcodes);
  const mapsNote = truncated ? ` <span class="leg-duration">(first ${MAPS_MAX_STOPS} stops)</span>` : '';

  let html = `<div class="route-header"><a class="maps-route-link" href="${mapsUrl}" target="_blank" rel="noopener">&#128205; Map route</a>${mapsNote}</div>`;
  html += '<div class="route">';

  const startPostcode = storagePostcode || (stops[0] ? stops[0].postcode : '?');
  html += renderLocationNode(startPostcode, storagePostcode ? 'Storage' : 'Starting location unknown', storagePostcode ? 'depot' : 'home');

  function renderVehicleLeg(leg) {
    if (leg.mode === 'driving' && leg.driver) {
      return `
    <div class="route-leg">
      <div class="route-leg-spine"><div class="route-leg-line driving"></div></div>
      <div class="route-leg-content">
        <span class="leg-mode driving">&#128663; driving</span>
        ${driverLink(leg.driver)}
      </div>
    </div>`;
    }
    return `
      <div class="route-leg">
        <div class="route-leg-spine"><div class="route-leg-line idle"></div></div>
        <div class="route-leg-content" style="color:#aaa;font-size:10px;font-style:italic">parked</div>
      </div>`;
  }

  stops.forEach((stop, i) => {
    html += renderVehicleLeg(legModes[i]);
    const dotType = stop.type === 'collect' ? 'collect' : stop.type === 'deliver' ? 'deliver' : 'home';
    const actionLabel = stop.type === 'collect'
      ? `<span class="action-collect">Collect:</span>`
      : stop.type === 'deliver'
      ? `<span class="action-deliver">Deliver:</span>`
      : '';
    const timeLabel = stop.time ? `<strong>${esc(stop.time)}</strong>` : '';
    const driverPart = stop.driver ? ` &middot; ${driverLink(stop.driver)}` : '';
    const bookRef = stop.bookNo ? `<span class="book-ref">${bookingLink(stop.bookNo)}</span>` : '';

    html += `
      <div class="route-node">
        <div class="route-node-spine">${renderDot(dotType)}</div>
        <div class="route-node-content">
          <div class="route-node-label">${actionLabel} ${stop.type === 'collect' ? 'from' : 'to'} ${mapsLink(stop.postcode)} @ ${timeLabel}${driverPart} ${bookRef}</div>
        </div>
      </div>`;
  });

  if (stops.length) {
    html += renderVehicleLeg(finalLeg);
    html += renderLocationNode(stops[stops.length - 1].postcode, 'Resting location', 'home');
  }

  html += '</div>';
  return html;
}


// ─── ACCORDION TOGGLE ────────────────────────────────────────────────────────
function toggleAccordion(header) {
  const body = header.nextElementSibling;
  const isOpen = header.classList.contains('open');
  header.classList.toggle('open', !isOpen);
  body.classList.toggle('open', !isOpen);
}

// Override jumpTo to also expand the accordion
function jumpTo(type, key) {
  const id = anchorId(type, key);
  const container = document.getElementById(id);
  if (!container) return;
  // Find accordion header within
  const header = container.querySelector('.accordion-header');
  if (header && !header.classList.contains('open')) toggleAccordion(header);
  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
  container.classList.remove('highlight-flash');
  void container.offsetWidth;
  container.classList.add('highlight-flash');
}
